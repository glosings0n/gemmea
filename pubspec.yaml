name: juamea
description: "Juamea: Assistant agronomique IA hors ligne pour les agriculteurs de l'Est de la RDC et de l'Afrique de l'Est."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_edge_ai: ^2.5.4
  flutter_edge_ai_litertlm: ^1.19.0
  flutter_markdown_plus: ^1.0.12
  http: ^1.2.1
  hugeicons: ^1.1.7
  image_picker: ^1.1.2
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.3
  sautilm_sdk:
    path: ../packages/sautilm_sdk
  pdf: ^3.11.1
  printing: ^5.14.3
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3
  shorebird_code_push: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/models/
    - assets/images/logo.png
    - shorebird.yaml
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Regular.ttf
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
